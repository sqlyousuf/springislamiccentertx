  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#gold)" stroke-width="1" opacity=".6"/>
  <!-- eight-point star (Rub el Hizb) -->
  <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round">
    <rect x="47" y="47" width="106" height="106"/>
    <rect x="47" y="47" width="106" height="106" transform="rotate(45 100 100)"/>
