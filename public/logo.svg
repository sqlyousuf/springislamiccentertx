<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Spring Islamic Center logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc9b"/>
      <stop offset=".5" stop-color="#d4af5a"/>
      <stop offset="1" stop-color="#a9812f"/>
