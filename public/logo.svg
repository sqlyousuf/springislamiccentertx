  <path d="M92 142v-14a8 8 0 0 1 16 0v14z" fill="#0b1f3a"/>
  <path d="M78 118a4 4 0 0 1 8 0v8h-8zM114 118a4 4 0 0 1 8 0v8h-8z" fill="#0b1f3a"/>
